   name: Deploy to GitHub Pages

   on:
     push:
       branches:
         - reactversion

   jobs:
     build-and-deploy:
       runs-on: ubuntu-latest
       steps:
         - name: Checkout
           uses: actions/checkout@v3

         - name: Setup Node.js
           uses: actions/setup-node@v2
           with:
             node-version: '20'

         - name: Install dependencies
           run: npm ci

         - name: Build
           run: |
             npm run build
             ls -la build
           env:
             CI: false

         - name: Deploy
           uses: JamesIves/github-pages-deploy-action@v4
           with:
             branch: gh-pages
             folder: build